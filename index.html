<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="apple-touch-icon" href="./icono.PNG">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ALTHERIA – MedIQ Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <!-- React + Babel (standalone, sin bundler) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body,#root{font-family:'Outfit',system-ui,sans-serif;background:#eef2ff;overflow-x:hidden;min-height:100vh;}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}
    ::-webkit-scrollbar-track{background:transparent;}

    @keyframes fadeUp    {from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn    {from{opacity:0}to{opacity:1}}
    @keyframes popIn     {from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}
    @keyframes slideRight{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
    @keyframes slideUp   {from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin      {to{transform:rotate(360deg)}}
    @keyframes pulse3    {0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.55;transform:scale(0.9)}}
    @keyframes float     {0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes bounce3   {0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}60%{transform:translateY(-4px)}}
    @keyframes dragon    {0%,100%{transform:rotate(-2deg)scale(1)}50%{transform:rotate(2deg)scale(1.04)}}
    @keyframes heartbeat {0%,100%{transform:scale(1)}14%{transform:scale(1.2)}28%{transform:scale(1)}42%{transform:scale(1.1)}}
    @keyframes shimmer   {0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes toastIn   {from{opacity:0;transform:translateX(120%)}to{opacity:1;transform:translateX(0)}}
    @keyframes toastOut  {from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(120%)}}
    @keyframes progress  {from{width:0}to{width:100%}}

    .fade-up    {animation:fadeUp   0.45s cubic-bezier(0.22,1,0.36,1) both;}
    .fade-in    {animation:fadeIn   0.35s ease both;}
    .pop-in     {animation:popIn    0.4s  cubic-bezier(0.34,1.56,0.64,1) both;}
    .slide-right{animation:slideRight 0.4s cubic-bezier(0.22,1,0.36,1) both;}
    .s1{animation-delay:0.05s} .s2{animation-delay:0.10s} .s3{animation-delay:0.15s}
    .s4{animation-delay:0.20s} .s5{animation-delay:0.25s} .s6{animation-delay:0.30s}

    .hover-lift{transition:transform 0.2s,box-shadow 0.2s;}
    .hover-lift:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(42,127,255,0.15)!important;}
    .press:active{transform:scale(0.96)!important;}
    .glass{background:rgba(255,255,255,0.84);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.92);}
    .dark-glass{background:rgba(10,22,40,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}

    .opt-btn{transition:all 0.18s cubic-bezier(0.22,1,0.36,1);}
    .opt-btn:hover{background:rgba(42,127,255,0.13)!important;border-color:#2A7FFF!important;transform:translateX(5px);}
    .nav-web:hover{background:rgba(42,127,255,0.09)!important;color:#2A7FFF!important;}
    input:focus,textarea:focus{outline:none!important;border-color:#2A7FFF!important;box-shadow:0 0 0 3px rgba(42,127,255,0.13)!important;}

    .dark-mode{background:#0a0f1e!important;color:#e2e8f0!important;}
    .dark-mode .glass{background:rgba(15,23,42,0.88)!important;border-color:rgba(255,255,255,0.08)!important;}
    .dark-mode .card-inner{background:#0f172a!important;border-color:#1e293b!important;color:#e2e8f0!important;}

    @media(max-width:768px){
      .web-sidebar{display:none!important;}
      .web-main{padding:12px!important;}
      .web-grid4{grid-template-columns:1fr 1fr!important;}
      .web-grid2{grid-template-columns:1fr!important;}
      .web-flex-col{flex-direction:column!important;}
      .hide-mobile{display:none!important;}
      .mobile-header{display:flex!important;}
      .web-header-title{font-size:15px!important;}
    }
    @media(min-width:769px){
      .mobile-only{display:none!important;}
      .mobile-nav{display:none!important;}
    }
    .mobile-header{display:none;}

    .cal-day:hover{background:rgba(42,127,255,0.1)!important;cursor:pointer;}
    .cal-day.has-event{font-weight:800;color:#2A7FFF;}
    .cal-day.selected{background:linear-gradient(135deg,#2A7FFF,#00C6FF)!important;color:white!important;border-radius:50%;}

    .skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ══════════════════════════════════════════════════════════
       LOGO
    ══════════════════════════════════════════════════════════ */
    function AlthLogo({ size=40, animate=false }) {
      return (
        <svg width={size} height={size} viewBox="0 0 120 120" fill="none"
          style={{animation:animate?"dragon 4s ease-in-out infinite":"none",flexShrink:0}}>
          <ellipse cx="52" cy="68" rx="34" ry="28" fill="url(#ac1)"/>
          <ellipse cx="38" cy="60" rx="22" ry="20" fill="url(#ac1)"/>
          <ellipse cx="68" cy="58" rx="20" ry="18" fill="url(#ac2)"/>
          <ellipse cx="55" cy="52" rx="18" ry="16" fill="url(#ac1)"/>
          <ellipse cx="42" cy="72" rx="16" ry="12" fill="white" opacity="0.6"/>
          <rect x="42" y="58" width="18" height="6" rx="3" fill="white" opacity="0.95"/>
          <rect x="48" y="52" width="6" height="18" rx="3" fill="white" opacity="0.95"/>
          <path d="M72 45 Q80 30 88 28 Q92 27 90 33 Q96 28 98 34 Q100 40 94 44 Q98 46 96 52 Q92 58 86 56 Q80 60 76 56" fill="url(#ad1)"/>
          <path d="M76 56 Q72 65 68 70 Q64 75 70 78 Q68 82 74 80" stroke="url(#ad1)" strokeWidth="3.5" fill="none" strokeLinecap="round"/>
          <circle cx="90" cy="34" r="3" fill="#1a4a7a"/>
          <circle cx="91" cy="33" r="1" fill="white"/>
          <path d="M86 40 Q94 36 98 40 Q96 46 88 48" fill="url(#ac2)" opacity="0.7"/>
          <path d="M94 30 Q96 27 99 29 Q102 27 104 30 Q104 33 99 37 Q94 33 94 30Z" fill="#5ba3d4" opacity="0.8"/>
          <defs>
            <linearGradient id="ac1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#deeeff"/><stop offset="100%" stopColor="#c5dcf5"/></linearGradient>
            <linearGradient id="ac2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#c8dff5"/><stop offset="100%" stopColor="#b0ceea"/></linearGradient>
            <linearGradient id="ad1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#7bb8d8"/><stop offset="100%" stopColor="#4a90c4"/></linearGradient>
          </defs>
        </svg>
      );
    }

    function LogoFull({ size=36, sub=false, dark=false }) {
      return (
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <AlthLogo size={size}/>
          <div>
            <div style={{fontWeight:900,fontSize:size*0.44,color:dark?"#e2e8f0":"#0f172a",letterSpacing:"-0.03em",lineHeight:1}}>ALTHERIA</div>
            {sub && <div style={{fontSize:size*0.24,color:"#4a90c4",fontWeight:700,letterSpacing:"0.05em"}}>Health Orientation & Triage</div>}
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════
       PRIMITIVES
    ══════════════════════════════════════════════════════════ */
    function Badge({ children, color="#2A7FFF", bg, dot=false }) {
      return (
        <span style={{display:"inline-flex",alignItems:"center",gap:5,background:bg||color+"1a",color,padding:"3px 10px",borderRadius:20,fontSize:10,fontWeight:800,letterSpacing:"0.07em",textTransform:"uppercase",whiteSpace:"nowrap"}}>
          {dot && <span style={{width:6,height:6,borderRadius:"50%",background:color,animation:"pulse3 1.5s ease infinite",flexShrink:0}}/>}
          {children}
        </span>
      );
    }

    function Card({ children, style={}, className="", onClick }) {
      return (
        <div onClick={onClick} className={`glass hover-lift ${className}`}
          style={{borderRadius:20,padding:20,boxShadow:"0 4px 24px rgba(42,127,255,0.07)",cursor:onClick?"pointer":"default",...style}}>
          {children}
        </div>
      );
    }

    function Btn({ children, onClick, v="primary", style={}, disabled=false, icon, full=false }) {
      const V = {
        primary:  {background:"linear-gradient(135deg,#2A7FFF,#00C6FF)",color:"white",border:"none",boxShadow:"0 4px 18px rgba(42,127,255,0.35)"},
        secondary:{background:"#eff6ff",color:"#2A7FFF",border:"none"},
        outline:  {background:"white",color:"#475569",border:"1px solid #e2e8f0"},
        ghost:    {background:"transparent",color:"#64748b",border:"none"},
        danger:   {background:"#fef2f2",color:"#dc2626",border:"1px solid #fecaca"},
        success:  {background:"#f0fdf4",color:"#16a34a",border:"1px solid #bbf7d0"},
        dark:     {background:"#0f172a",color:"white",border:"none"},
      };
      return (
        <button disabled={disabled} onClick={onClick} className="press"
          style={{display:"inline-flex",alignItems:"center",gap:7,padding:"9px 18px",borderRadius:13,fontWeight:700,fontSize:13,cursor:disabled?"not-allowed":"pointer",fontFamily:"inherit",transition:"all 0.18s",opacity:disabled?0.5:1,width:full?"100%":undefined,justifyContent:full?"center":undefined,...V[v],...style}}>
          {icon && <span style={{fontSize:15}}>{icon}</span>}{children}
        </button>
      );
    }

    function ProgBar({ pct, color="#2A7FFF", h=8 }) {
      return (
        <div style={{background:"#f1f5f9",borderRadius:99,height:h,overflow:"hidden"}}>
          <div style={{width:`${pct}%`,height:"100%",borderRadius:99,background:`linear-gradient(90deg,${color},${color}cc)`,transition:"width 0.8s cubic-bezier(0.22,1,0.36,1)"}}/>
        </div>
      );
    }

    function Avatar({ name, size=38, color="#2A7FFF" }) {
      return (
        <div style={{width:size,height:size,borderRadius:"50%",background:`linear-gradient(135deg,${color},${color}88)`,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:900,fontSize:size*0.38,flexShrink:0,boxShadow:`0 2px 12px ${color}40`}}>
          {name?.[0]?.toUpperCase()}
        </div>
      );
    }

    function Divider({ label }) {
      return (
        <div style={{display:"flex",alignItems:"center",gap:10,margin:"10px 0"}}>
          <div style={{flex:1,height:1,background:"#f1f5f9"}}/>
          {label && <span style={{fontSize:10,color:"#94a3b8",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em"}}>{label}</span>}
          <div style={{flex:1,height:1,background:"#f1f5f9"}}/>
        </div>
      );
    }

    /* Toast notification system */
    function Toast({ toasts, remove }) {
      return (
        <div style={{position:"fixed",top:20,right:20,zIndex:9999,display:"flex",flexDirection:"column",gap:8}}>
          {toasts.map(t => (
            <div key={t.id} onClick={()=>remove(t.id)}
              style={{
                background:t.type==="error"?"#fef2f2":t.type==="success"?"#f0fdf4":t.type==="warn"?"#fffbeb":"white",
                border:`1px solid ${t.type==="error"?"#fecaca":t.type==="success"?"#bbf7d0":t.type==="warn"?"#fde68a":"#e2e8f0"}`,
                borderLeft:`4px solid ${t.type==="error"?"#dc2626":t.type==="success"?"#16a34a":t.type==="warn"?"#d97706":"#2A7FFF"}`,
                borderRadius:14,padding:"12px 16px",maxWidth:300,cursor:"pointer",
                boxShadow:"0 8px 32px rgba(0,0,0,0.12)",
                animation:`${t.leaving?"toastOut":"toastIn"} 0.35s ease both`
              }}>
              <div style={{fontWeight:800,fontSize:13,color:"#0f172a",marginBottom:3}}>{t.icon} {t.title}</div>
              <div style={{fontSize:12,color:"#64748b"}}>{t.msg}</div>
            </div>
          ))}
        </div>
      );
    }

    function useToast() {
      const [toasts, setToasts] = useState([]);
      const add = useCallback((title, msg, type="info", icon="💬") => {
        const id = Date.now();
        setToasts(t => [...t, { id, title, msg, type, icon }]);
        setTimeout(() => setToasts(t => t.map(x => x.id===id ? {...x,leaving:true} : x)), 3200);
        setTimeout(() => setToasts(t => t.filter(x => x.id!==id)), 3600);
      }, []);
      const remove = useCallback(id => setToasts(t => t.filter(x => x.id!==id)), []);
      return { toasts, add, remove };
    }

    /* ══════════════════════════════════════════════════════════
       TRIAGE DATA TREE
    ══════════════════════════════════════════════════════════ */
    const TREE = {
      start:       { ai:"Hola Carlos 👋 Soy tu asistente MedIQ. ¿Cuál es el síntoma principal que te preocupa hoy?", opts:[{l:"💔 Dolor en el pecho",n:"chest"},{l:"🌡️ Fiebre alta",n:"fever"},{l:"🤕 Dolor de cabeza intenso",n:"head"},{l:"😮‍💨 Dificultad respiratoria",n:"breath"},{l:"🤢 Náuseas o vómitos",n:"nausea"},{l:"🦴 Dolor muscular o articular",n:"muscle"}]},
      chest:       { ai:"Entiendo. El dolor torácico requiere atención especial. ¿Cómo lo describirías?", opts:[{l:"Presión fuerte, como un peso",n:"chest2"},{l:"Punzada aguda y localizada",n:"chest_mild"},{l:"Ardor que sube a la garganta",n:"chest_mild"},{l:"Opresión que va y viene",n:"chest2"}]},
      chest2:      { ai:"¿Se irradia el dolor hacia el brazo izquierdo, cuello o mandíbula?", opts:[{l:"Sí, claramente al brazo izquierdo",n:"chest_u"},{l:"Sí, noto algo en cuello/mandíbula",n:"chest_u"},{l:"No, solo en el pecho",n:"chest3"},{l:"No estoy seguro/a",n:"chest3"}]},
      chest3:      { ai:"¿Tienes dificultad para respirar, mareos o sudoración fría con el dolor?", opts:[{l:"Sí, me falta el aire",n:"chest_u"},{l:"Tengo mareos o vértigo",n:"chest_u"},{l:"Sudo frío de forma inusual",n:"chest_u"},{l:"No, solo el dolor",n:"chest_m"}]},
      chest_u:     { result:"urgent",   spec:"Cardiología",            risk:94, wait:"Inmediato" },
      chest_m:     { result:"moderate", spec:"Medicina Interna",       risk:45, wait:"20 min"   },
      chest_mild:  { result:"mild",     spec:"Medicina General",       risk:22, wait:"35 min"   },
      fever:       { ai:"¿Cuánto tiempo llevas con fiebre y cuánta temperatura tienes?", opts:[{l:"Más de 39°C hace más de 48h",n:"fever2"},{l:"Entre 38-39°C desde ayer",n:"fever_mild"},{l:"Acabo de notar 39°C+",n:"fever2"},{l:"No pude medirla",n:"fever2"}]},
      fever2:      { ai:"¿Tienes alguno de estos síntomas junto a la fiebre?", opts:[{l:"Rigidez en el cuello o fotofobia",n:"fever_u"},{l:"Erupción o manchas en la piel",n:"fever_u"},{l:"Confusión o dificultad para pensar",n:"fever_u"},{l:"Solo cansancio y escalofríos",n:"fever_m"}]},
      fever_u:     { result:"urgent",   spec:"Urgencias",              risk:88, wait:"Inmediato" },
      fever_m:     { result:"moderate", spec:"Medicina General",       risk:52, wait:"25 min"   },
      fever_mild:  { result:"mild",     spec:"Medicina General",       risk:28, wait:"40 min"   },
      head:        { ai:"¿Cómo comenzó el dolor de cabeza?", opts:[{l:"De repente, como un estallido",n:"head_u"},{l:"Gradualmente, empeorando",n:"head2"},{l:"Llevo días, pero hoy peor",n:"head2"},{l:"Tras un golpe o caída",n:"head_u"}]},
      head2:       { ai:"¿Tienes visión doble, entumecimiento facial o dificultad para hablar?", opts:[{l:"Sí, veo doble o borroso",n:"head_u"},{l:"Siento la cara o brazo dormido",n:"head_u"},{l:"Me cuesta hablar",n:"head_u"},{l:"No, solo el dolor",n:"head_m"}]},
      head_u:      { result:"urgent",   spec:"Neurología",             risk:85, wait:"Inmediato" },
      head_m:      { result:"moderate", spec:"Neurología",             risk:40, wait:"30 min"   },
      breath:      { ai:"¿Con qué intensidad aparece la dificultad respiratoria?", opts:[{l:"En reposo, sin hacer nada",n:"breath_u"},{l:"Con mínimo esfuerzo",n:"breath2"},{l:"Solo con ejercicio",n:"breath_mild"}]},
      breath2:     { ai:"¿Tienes los labios o uñas azulados, o sensación de ahogo?", opts:[{l:"Sí, noto algo azulado",n:"breath_u"},{l:"Siento que me ahogo",n:"breath_u"},{l:"No, pero me agito muy rápido",n:"breath_m"}]},
      breath_u:    { result:"urgent",   spec:"Urgencias / Neumología", risk:91, wait:"Inmediato" },
      breath_m:    { result:"moderate", spec:"Neumología",             risk:55, wait:"20 min"   },
      breath_mild: { result:"mild",     spec:"Medicina General",       risk:25, wait:"45 min"   },
      nausea:      { ai:"¿Desde cuándo y con qué frecuencia tienes náuseas o vómitos?", opts:[{l:"Llevo vomitando más de 6 horas",n:"nausea_m"},{l:"Hay sangre en el vómito",n:"nausea_u"},{l:"Desde hace pocas horas, puntual",n:"nausea_mild"},{l:"Con mareos muy intensos",n:"nausea_m"}]},
      nausea_u:    { result:"urgent",   spec:"Urgencias / Digestivo",  risk:80, wait:"Inmediato" },
      nausea_m:    { result:"moderate", spec:"Medicina General",       risk:42, wait:"30 min"   },
      nausea_mild: { result:"mild",     spec:"Medicina General",       risk:18, wait:"50 min"   },
      muscle:      { ai:"¿Qué zona te duele principalmente?", opts:[{l:"Espalda baja o lumbares",n:"muscle_mild"},{l:"Rodilla o tobillo (posible lesión)",n:"muscle_mild"},{l:"Varias articulaciones a la vez",n:"muscle_m"},{l:"Cuello con dolor al brazo",n:"muscle_m"}]},
      muscle_m:    { result:"moderate", spec:"Traumatología",          risk:35, wait:"35 min"   },
      muscle_mild: { result:"mild",     spec:"Medicina General",       risk:15, wait:"55 min"   },
    };

    const RC = {
      urgent:  {color:"#dc2626",bg:"#fef2f2",border:"#fecaca",icon:"🚨",label:"PRIORIDAD URGENTE"},
      moderate:{color:"#d97706",bg:"#fffbeb",border:"#fde68a",icon:"⚠️",label:"PRIORIDAD MODERADA"},
      mild:    {color:"#16a34a",bg:"#f0fdf4",border:"#bbf7d0",icon:"✅",label:"PRIORIDAD NORMAL"},
    };

    /* ══════════════════════════════════════════════════════════
       SPLASH SCREEN
    ══════════════════════════════════════════════════════════ */
    function SplashScreen({ onDone }) {
      const [progress, setProgress] = useState(0);
      useEffect(() => {
        const steps = [
          {t:400,  v:30},
          {t:900,  v:60},
          {t:1500, v:85},
          {t:2200, v:100},
        ];
        steps.forEach(s => setTimeout(() => setProgress(s.v), s.t));
        setTimeout(onDone, 2800);
      }, []);

      return (
        <div style={{position:"fixed",inset:0,zIndex:9999,background:"linear-gradient(135deg,#080e1e 0%,#0a1628 50%,#0d1f3c 100%)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div style={{position:"absolute",inset:0,opacity:0.05,backgroundImage:"linear-gradient(#2A7FFF 1px,transparent 1px),linear-gradient(90deg,#2A7FFF 1px,transparent 1px)",backgroundSize:"44px 44px"}}/>
          {[["12%","8%","#2A7FFF"],["82%","78%","#00C6FF"],["88%","12%","#7c3aed"]].map(([t,l,c],i)=>(
            <div key={i} style={{position:"absolute",top:t,left:l,width:260,height:260,borderRadius:"50%",background:`radial-gradient(circle,${c}30,transparent 70%)`,filter:"blur(50px)",pointerEvents:"none"}}/>
          ))}
          <div style={{position:"relative",textAlign:"center"}}>
            <div style={{marginBottom:28,animation:"dragon 3s ease-in-out infinite, fadeIn 0.6s ease both",filter:"drop-shadow(0 0 30px rgba(42,127,255,0.5))"}}>
              <AlthLogo size={120}/>
            </div>
            <div style={{animation:"fadeUp 0.7s 0.4s ease both"}}>
              <div style={{fontWeight:900,fontSize:46,color:"white",letterSpacing:"-0.04em",marginBottom:6}}>ALTHERIA</div>
              <div style={{fontSize:13,color:"#60a5fa",fontWeight:700,letterSpacing:"0.22em",textTransform:"uppercase",marginBottom:8}}>Health Orientation & Triage</div>
              <div style={{fontSize:12,color:"#334155",fontWeight:600,marginBottom:40}}>MedIQ Platform v2.4 · 2026</div>
            </div>
            <div style={{animation:"fadeIn 0.5s 0.8s ease both",width:280}}>
              <div style={{background:"rgba(255,255,255,0.08)",borderRadius:99,height:4,overflow:"hidden",marginBottom:10}}>
                <div style={{width:`${progress}%`,height:"100%",background:"linear-gradient(90deg,#2A7FFF,#00C6FF)",borderRadius:99,transition:"width 0.6s ease",boxShadow:"0 0 10px rgba(42,127,255,0.6)"}}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#475569",fontWeight:700}}>
                <span>{["Iniciando...","Cargando IA...","Verificando RGPD...","¡Listo!"][progress<30?0:progress<60?1:progress<100?2:3]}</span>

      const [chatInput, setChatInput] = useState("");

        if (!chatInput.trim()) return;
        const msg = chatInput.trim(); setChatInput(""); setSending(true);
        setChatMsgs(m=>[...m,{from:"user",text:msg}]);
        const lower = msg.toLowerCase();
        let reply;
        if (lower.includes("cita") || lower.includes("cit") || lower.includes("visita")) {
          reply = "Tu próxima cita es el 15 de Mayo a las 10:30 con la Dra. López (Consulta 3). ¿Necesitas cambiar el horario o tienes alguna duda para esa visita?";
        } else if (lower.includes("medicación") || lower.includes("medicacion") || lower.includes("losartán") || lower.includes("losartan") || lower.includes("pastilla")) {
          reply = "Tienes prescrito Losartán 50mg una vez al día (preferiblemente por las mañanas). Si notas efectos secundarios como mareos o tos seca, comunícamelo para consultarlo con la Dra. López.";
        } else if (lower.includes("dolor") || lower.includes("duele") || lower.includes("molestia")) {
          reply = "Lamento escuchar que tienes dolor. ¿Puedes describirme dónde y con qué intensidad del 1 al 10? Con esa información puedo evaluar si necesitas atención urgente o puede esperar a tu próxima cita.";
        } else if (lower.includes("resultado") || lower.includes("analítica") || lower.includes("analisi") || lower.includes("informe")) {
          reply = "He revisado tus últimos resultados. El análisis de Enero mostró vitamina D ligeramente baja (22 ng/mL). ¿Estás tomando el suplemento que te recetó el médico? Los demás valores estaban dentro del rango normal.";
        } else if (lower.includes("tension") || lower.includes("tensión") || lower.includes("presión") || lower.includes("presion")) {
          reply = "Tu última medición fue 140/90 mmHg (Marzo 2026). Con el Losartán debería ir bajando. Te recomiendo medirla en casa cada semana y anotarla. ¿Quieres que te indique cómo hacerlo correctamente?";
        } else if (lower.includes("hola") || lower.includes("buenos") || lower.includes("buenas")) {
          reply = "¡Hola Carlos! 👋 Me alegra que estés aquí. ¿En qué puedo ayudarte hoy? Puedo resolver dudas sobre tus citas, medicación, resultados o síntomas.";

        }
        setTimeout(()=>{setSending(false);setChatMsgs(m=>[...m,{from:"ai",text:reply}]);},1400);
      };

      useEffect(()=>{chatRef.current?.scrollIntoView({behavior:"smooth"});},[chatMsgs,sending]);

        ["👥","Pacientes","pacientes"],
        ["📋","Informes IA","informes"],
        ["💬","Mensajes","chat"],
        ["📊","Analytics","analytics"],
        ["🔔","Alertas","alertas"],
      ];
      const navAdm = [
        ["📊","Overview","overview"],
        ["⚙️","Operaciones","operaciones"],
        ["👥","Usuarios","usuarios"],
        ["🧠","Config. IA","ia"],
        ["🛡️","RGPD","rgpd"],
        ["🌱","Eco Impact","eco"],
      ];
      const nav = role==="medico" ? navMed : navAdm;

      const handleNav = (sectionId) => {
        setSection(sectionId);
        setMobileMenu(false);
      };

      return (
        <div style={{display:"flex",height:"100vh",fontFamily:"'Outfit',sans-serif",background:"#f8faff"}}>
          <aside className="web-sidebar" style={{width:228,background:"white",borderRight:"1px solid #e8edf5",display:"flex",flexDirection:"column",boxShadow:"2px 0 20px rgba(42,127,255,0.04)"}}>
            <div style={{padding:"22px 18px 14px",borderBottom:"1px solid #f1f5f9"}}>
              <LogoFull size={30} sub/>
            </div>
            <div style={{flex:1,padding:"10px 8px",overflowY:"auto"}}>
              <div style={{fontSize:10,color:"#94a3b8",fontWeight:800,textTransform:"uppercase",letterSpacing:"0.08em",padding:"6px 10px 6px"}}>Navegación</div>
              {nav.map(([icon,label,sid])=>{
                const active = section===sid;
                return (
                  <div key={sid} onClick={()=>handleNav(sid)} className="nav-web"
                    style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:12,marginBottom:2,cursor:"pointer",fontWeight:600,fontSize:13,transition:"all 0.15s",background:active?"linear-gradient(135deg,rgba(42,127,255,0.1),rgba(0,198,255,0.05))":"transparent",color:active?"#2A7FFF":"#475569"}}>
                    <span style={{fontSize:16}}>{icon}</span>{label}
                    {active && <div style={{marginLeft:"auto",width:6,height:6,borderRadius:"50%",background:"#2A7FFF"}}/>}
                    {sid==="alertas"&&<span style={{marginLeft:"auto",background:"#dc2626",color:"white",borderRadius:20,fontSize:10,fontWeight:800,padding:"1px 6px"}}>3</span>}
                  </div>
                );
              })}
            </div>
            <div style={{margin:"8px 8px 12px",padding:12,background:"#f8faff",borderRadius:14,border:"1px solid #e8edf5"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <Avatar name={user.nombre} size={36}/>
                <div style={{flex:1,overflow:"hidden"}}>
                  <div style={{fontWeight:800,fontSize:13,color:"#0f172a",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.nombre}</div>
                  <div style={{fontSize:11,color:"#64748b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.especialidad||user.rol}</div>
                </div>
              </div>
              <button onClick={logout} style={{width:"100%",padding:"7px",borderRadius:9,border:"1px solid #e2e8f0",background:"white",color:"#64748b",cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:6,transition:"all 0.15s"}}>🚪 Cerrar sesión</button>
            </div>
          </aside>

          <main style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            <header style={{height:60,padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(255,255,255,0.88)",backdropFilter:"blur(20px)",borderBottom:"1px solid #e8edf5",zIndex:10}}>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <button className="mobile-only" onClick={()=>setMobileMenu(!mobileMenuOpen)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer"}}>☰</button>
                <div className="web-header-title" style={{fontWeight:900,fontSize:17,color:"#0f172a"}}>
                  {role==="medico"?"Centro de Control Médico 🏥":"Panel de Administración 📊"}
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{position:"relative"}} className="hide-mobile">
                  <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:13}}>🔍</span>
                  <input placeholder="Buscar..." style={{padding:"7px 14px 7px 30px",borderRadius:11,border:"1.5px solid #e2e8f0",fontSize:12,fontFamily:"inherit",background:"#f8faff",width:200}}/>
                </div>
                <div style={{position:"relative"}}>
                  <button onClick={()=>setNotif(!notifOpen)} style={{width:36,height:36,borderRadius:11,border:"1.5px solid #e2e8f0",background:"white",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>🔔</button>
                  <span style={{position:"absolute",top:5,right:5,width:8,height:8,borderRadius:"50%",background:"#dc2626",border:"2px solid white"}}/>
                  {notifOpen && (
                    <div style={{position:"absolute",top:44,right:0,width:260,background:"white",borderRadius:16,border:"1px solid #e2e8f0",boxShadow:"0 12px 40px rgba(0,0,0,0.12)",zIndex:50,overflow:"hidden",animation:"popIn 0.2s ease"}}>
                      <div style={{padding:"11px 14px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:13,color:"#0f172a"}}>Notificaciones</div>
                      {(role==="medico" ? [
                        {icon:"🚨",text:"Carlos Ruiz – Triaje urgente activo",time:"Ahora",bg:"#fef2f2"},
                        {icon:"📋",text:"Nuevo informe IA – Ana Silva",time:"5 min",bg:"white"},
                        {icon:"⚠️",text:"Saturación alta en Urgencias (82%)",time:"12 min",bg:"#fffbeb"}
                      ] : [
                        {icon:"📊",text:"Informe diario generado – 17 Mayo",time:"Ahora",bg:"#eff6ff"},
                        {icon:"👥",text:"84 pacientes atendidos hoy (+37%)",time:"10 min",bg:"white"},
                        {icon:"⚙️",text:"Mantenimiento programado: domingo 02:00",time:"1h",bg:"#fffbeb"}
                      ]).map((n,i)=>(
                        <div key={i} onClick={()=>{setNotif(false);addToast(n.icon,n.text,"info",n.icon);}} style={{padding:"11px 14px",background:n.bg,borderBottom:i<2?"1px solid #f1f5f9":"",display:"flex",gap:9,cursor:"pointer"}}>
                          <span style={{fontSize:15}}>{n.icon}</span>
                          <div style={{flex:1}}><div style={{fontSize:12,color:"#0f172a",fontWeight:600}}>{n.text}</div><div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>{n.time}</div></div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <Avatar name={user.nombre} size={32}/>
              </div>
            </header>

            {mobileMenuOpen && (
              <div style={{position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,0.5)"}} onClick={()=>setMobileMenu(false)}>
                <div style={{position:"absolute",left:0,top:0,bottom:0,width:240,background:"white",padding:20,animation:"slideRight 0.3s ease"}} onClick={e=>e.stopPropagation()}>
                  <div style={{marginBottom:20}}><LogoFull size={28}/></div>
                  {nav.map(([icon,label,sid])=>(
                    <div key={sid} onClick={()=>handleNav(sid)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:12,marginBottom:4,cursor:"pointer",fontWeight:600,fontSize:14,background:section===sid?"#eff6ff":"transparent",color:section===sid?"#2A7FFF":"#475569"}}>
                      <span>{icon}</span>{label}
                    </div>
                  ))}
                  <div style={{position:"absolute",bottom:20,left:20,right:20}}>
                    <button onClick={logout} style={{width:"100%",padding:"10px",borderRadius:12,border:"1px solid #e2e8f0",background:"#fef2f2",color:"#dc2626",cursor:"pointer",fontSize:13,fontWeight:700,fontFamily:"inherit"}}>🚪 Cerrar sesión</button>
                  </div>
                </div>
              </div>
            )}

            <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
              {children}
            </div>
          </main>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════
       LOGIN SCREEN
    ══════════════════════════════════════════════════════════ */
    function LoginScreen({ onSelectRole }) {
      const [hovered, setHovered] = useState(null);
      const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
      useEffect(() => {
        const handler = () => setIsMobile(window.innerWidth < 768);
        window.addEventListener("resize", handler);
        return () => window.removeEventListener("resize", handler);
      }, []);
      const roles = [
        {id:"paciente",icon:"👤",em:"💊",title:"App de Paciente",  desc:"Triaje IA, citas, historial médico y chat"},
        {id:"medico",  icon:"👨‍⚕️",em:"🩺",title:"Panel de Médico",  desc:"Agenda inteligente, informes IA, pacientes"},
        {id:"admin",   icon:"📊",em:"⚙️", title:"Administración",   desc:"Analytics, operaciones, configuración IA"},
      ];
      return (
        <div style={{minHeight:"100vh",display:"flex",flexDirection:isMobile?"column":"row",fontFamily:"'Outfit',sans-serif"}}>
          {/* LEFT / TOP HERO PANEL */}
          <div style={{
            width:isMobile?"100%":"48%",
            minWidth:isMobile?0:340,
            background:"linear-gradient(160deg,#080e1e 0%,#0a1628 60%,#0d1f3c 100%)",
            padding:isMobile?"28px 24px":"44px 48px",
            display:"flex",flexDirection:"column",
            justifyContent:isMobile?"flex-start":"space-between",
            gap:isMobile?20:0,
            position:"relative",overflow:"hidden"
          }}>
            <div style={{position:"absolute",inset:0,opacity:0.05,backgroundImage:"linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px)",backgroundSize:"50px 50px"}}/>
            {[["14%","8%","#2A7FFF"],["72%","80%","#00C6FF"],["88%","14%","#7c3aed"]].map(([t,l,c],i)=>(
              <div key={i} style={{position:"absolute",top:t,left:l,width:240,height:240,borderRadius:"50%",background:`radial-gradient(circle,${c}35,transparent 70%)`,filter:"blur(50px)",pointerEvents:"none"}}/>
            ))}
            {/* Logo */}
            <div style={{position:"relative"}}>
              <div style={{display:"flex",alignItems:"center",gap:12,background:"rgba(255,255,255,0.08)",backdropFilter:"blur(10px)",padding:"11px 16px",borderRadius:16,width:"fit-content",border:"1px solid rgba(255,255,255,0.1)"}}>
                <AlthLogo size={36} animate/>
                <div><div style={{fontWeight:900,color:"white",fontSize:16,letterSpacing:"-0.02em"}}>ALTHERIA</div><div style={{fontSize:10,color:"#60a5fa",fontWeight:700,letterSpacing:"0.08em"}}>HEALTH ORIENTATION & TRIAGE</div></div>
              </div>
            </div>
            {/* Hero text */}
            <div style={{position:"relative"}}>
              <div style={{display:"inline-flex",alignItems:"center",gap:7,background:"rgba(42,127,255,0.2)",border:"1px solid rgba(42,127,255,0.3)",padding:"4px 12px",borderRadius:20,marginBottom:14}}>
                <span style={{width:6,height:6,borderRadius:"50%",background:"#00C6FF",animation:"pulse3 1.5s ease infinite",display:"inline-block"}}/>
                <span style={{fontSize:11,color:"#60a5fa",fontWeight:800,letterSpacing:"0.08em",textTransform:"uppercase"}}>MedIQ Platform · Demo v2.4</span>
              </div>
              <h1 style={{fontSize:isMobile?28:40,fontWeight:900,color:"white",lineHeight:1.15,marginBottom:12,letterSpacing:"-0.03em"}}>
                Triaje clínico<br/><span style={{background:"linear-gradient(90deg,#2A7FFF,#00C6FF)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>inteligente</span><br/>para tu clínica
              </h1>
              {!isMobile && (
                <p style={{fontSize:14,color:"rgba(255,255,255,0.58)",lineHeight:1.8,marginBottom:36,maxWidth:400}}>
                  Reduce tiempos de espera un <strong style={{color:"#60a5fa"}}>34%</strong>, automatiza el triaje y empodera a tu equipo médico con IA avanzada.
                </p>
              )}
              <div style={{display:"flex",gap:isMobile?16:28,flexWrap:"wrap"}}>
                {[["50K+","Pacientes"],["200+","Clínicas"],["96.3%","Precisión IA"]].map(([v,l])=>(
                  <div key={l}><div style={{fontSize:isMobile?18:24,fontWeight:900,color:"white",letterSpacing:"-0.02em"}}>{v}</div><div style={{fontSize:11,color:"rgba(255,255,255,0.42)",fontWeight:600}}>{l}</div></div>
                ))}
              </div>
            </div>
            {!isMobile && <div style={{position:"relative",fontSize:11,color:"rgba(255,255,255,0.2)",fontWeight:700}}>© 2026 Altheria Health Technologies SL · Madrid</div>}
          </div>

          {/* RIGHT / BOTTOM FORM PANEL */}
          <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:isMobile?"20px 16px 32px":"36px",background:"#f8faff"}}>
            <div style={{width:"100%",maxWidth:440}}>
              <div style={{marginBottom:24}}>
                <h2 style={{fontSize:isMobile?22:26,fontWeight:900,color:"#0f172a",marginBottom:8}}>Bienvenido de nuevo</h2>
                <p style={{color:"#64748b",fontSize:14}}>Selecciona tu perfil para explorar el prototipo</p>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:11}}>
                {roles.map((item,i)=>(
                  <button key={item.id} onClick={()=>onSelectRole(item.id)}
                    onMouseEnter={()=>setHovered(item.id)} onMouseLeave={()=>setHovered(null)}
                    className={`fade-up s${i+1} press`}
                    style={{padding:isMobile?14:18,background:"white",border:`2px solid ${hovered===item.id?"#2A7FFF":"#e2e8f0"}`,borderRadius:20,display:"flex",alignItems:"center",gap:14,cursor:"pointer",transition:"all 0.2s",textAlign:"left",fontFamily:"inherit",boxShadow:hovered===item.id?"0 8px 32px rgba(42,127,255,0.15)":"0 2px 8px rgba(0,0,0,0.04)",transform:hovered===item.id?"translateY(-1px)":"none"}}>
                    <div style={{width:isMobile?46:54,height:isMobile?46:54,borderRadius:17,background:hovered===item.id?"linear-gradient(135deg,#2A7FFF,#00C6FF)":"#f0f7ff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:isMobile?22:26,transition:"all 0.2s",flexShrink:0,boxShadow:hovered===item.id?"0 4px 16px rgba(42,127,255,0.35)":"none"}}>
                      {hovered===item.id?item.em:item.icon}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:800,fontSize:isMobile?14:15,color:hovered===item.id?"#2A7FFF":"#0f172a",marginBottom:3,transition:"color 0.2s"}}>{item.title}</div>
                      <div style={{fontSize:12,color:"#64748b"}}>{item.desc}</div>
                    </div>
                    <div style={{fontSize:20,color:hovered===item.id?"#2A7FFF":"#cbd5e1",transition:"all 0.2s",transform:hovered===item.id?"translateX(4px)":"none"}}>›</div>
                  </button>
                ))}
              </div>
              <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:isMobile?10:18,marginTop:24,paddingTop:20,borderTop:"1px solid #e2e8f0",flexWrap:"wrap"}}>
                {["🛡️ RGPD","🔒 ISO 27001","⚡ HL7 FHIR"].map(t=><span key={t} style={{fontSize:11,color:"#94a3b8",fontWeight:700}}>{t}</span>)}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════
       ROOT APP
    ══════════════════════════════════════════════════════════ */
    const MOCK = {
      medico:{nombre:"Dr. Alejandro Vega",especialidad:"Urgencias / Triaje"},
      admin: {nombre:"Laura Martínez",    rol:"Directora de Operaciones"}
    };

    function App() {
      const [splash,   setSplash]   = useState(true);
      const [onboard,  setOnboard]  = useState(false);
      const [role,     setRole]     = useState(null);
      const [section,  setSection]  = useState("agenda");
      const { toasts, add: addToast, remove } = useToast();

      const handleRole = (r) => {
        setRole(r);
        if (r==="paciente") setOnboard(true);
        if (r==="medico")   setSection("agenda");
        if (r==="admin")    setSection("overview");
      };

      const handleLogout = () => { setRole(null); setSection("agenda"); };

      return (
        <>
          <Toast toasts={toasts} remove={remove}/>
          {splash  && <SplashScreen onDone={()=>setSplash(false)}/>}
          {onboard && <OnboardingTour onDone={()=>setOnboard(false)}/>}
          {!splash && !onboard && !role && <LoginScreen onSelectRole={handleRole}/>}
          {!splash && !onboard && role==="paciente" && <PacienteApp logout={handleLogout} addToast={addToast}/>}
          {!splash && !onboard && role==="medico" && (
            <WebLayout role="medico" user={MOCK.medico} logout={handleLogout} addToast={addToast} section={section} setSection={setSection}>
              <MedicoDashboard addToast={addToast} section={section} setSection={setSection}/>
            </WebLayout>
          )}
          {!splash && !onboard && role==="admin" && (
            <WebLayout role="admin" user={MOCK.admin} logout={handleLogout} addToast={addToast} section={section} setSection={setSection}>
              <AdminDashboard addToast={addToast} section={section} setSection={setSection}/>
            </WebLayout>
          )}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
